  <script>
    // Viewbox center = 538
    // Left i center x = 144, right i center x = 957
    // Each i is ~80px wide
    // Gap between them = 0 (touching at center line)
    // Left i right edge = 538 -> left i center = 498 -> translateX = 498 - 144 = 354
    // Right i left edge = 538 -> right i center = 578 -> translateX = 578 - 957 = -379
    var LEFT_START  = 344;
    var RIGHT_START = -369;
    var SLIDE_DUR   = 2200;
    var HOLD        = 1200;
    var HOLD_FULL   = 1800;

    function easeInOut(t) { return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }
    function lerp(a,b,t)  { return a+(b-a)*t; }

    function animateTranslate(el, fromX, toX, duration, delay, onDone) {
      var start = null;
      function step(ts) {
        if (!start) start = ts + delay;
        var elapsed = ts - start;
        if (elapsed < 0) { requestAnimationFrame(step); return; }
        var t = Math.min(elapsed/duration, 1);
        el.setAttribute('transform','translate('+lerp(fromX, toX, easeInOut(t))+',0)');
        if (t < 1) requestAnimationFrame(step);
        else { el.setAttribute('transform','translate(0,0)'); if(onDone) onDone(); }
      }
      requestAnimationFrame(step);
    }

    function animateFadeUp(el, delay) {
      var start = null;
      el.style.opacity = '0';
      function step(ts) {
        if (!start) start = ts + delay;
        var elapsed = ts - start;
        if (elapsed < 0) { requestAnimationFrame(step); return; }
        var t = Math.min(elapsed/550, 1);
        var e = easeInOut(t);
        el.style.opacity = e;
        el.setAttribute('transform','translate(0,'+lerp(12,0,e)+')');
        if (t < 1) requestAnimationFrame(step);
        else { el.style.opacity='1'; el.setAttribute('transform','translate(0,0)'); }
      }
      requestAnimationFrame(step);
    }

    function animateFadeOut(el, delay, onDone) {
      var start = null;
      function step(ts) {
        if (!start) start = ts + delay;
        var elapsed = ts - start;
        if (elapsed < 0) { requestAnimationFrame(step); return; }
        var t = Math.min(elapsed/400, 1);
        el.style.opacity = 1 - easeInOut(t);
        if (t < 1) requestAnimationFrame(step);
        else { el.style.opacity='0'; if(onDone) onDone(); }
      }
      requestAnimationFrame(step);
    }

    function runAnim() {
      var il = document.getElementById('lil');
      var ir = document.getElementById('lir');
      var s  = document.getElementById('ls');
      var e  = document.getElementById('le');
      var t  = document.getElementById('lt');
      var n  = document.getElementById('ln');

      il.setAttribute('transform','translate('+LEFT_START+',0)');
      ir.setAttribute('transform','translate('+RIGHT_START+',0)');
      il.style.opacity = '1';
      ir.style.opacity = '1';
      [s,e,t,n].forEach(function(el){ el.style.opacity='0'; el.setAttribute('transform','translate(0,0)'); });

      setTimeout(function(){
        animateTranslate(il, LEFT_START, 0, SLIDE_DUR, 0, null);
        animateTranslate(ir, RIGHT_START, 0, SLIDE_DUR, 0, null);
        animateFadeUp(s,  SLIDE_DUR * 0.20);
        animateFadeUp(e,  SLIDE_DUR * 0.42);
        animateFadeUp(t,  SLIDE_DUR * 0.42);
        animateFadeUp(n,  SLIDE_DUR * 0.65);

        setTimeout(function(){
          [n,e,s,t].forEach(function(el, i){
            animateFadeOut(el, i * 80, null);
          });
          setTimeout(function(){
            animateTranslate(il, 0, LEFT_START, 900, 0, null);
            animateTranslate(ir, 0, RIGHT_START, 900, 0, null);
            setTimeout(runAnim, 1000);
          }, 400);
        }, SLIDE_DUR + HOLD_FULL);

      }, HOLD);
    }

    window.addEventListener('load', runAnim);
  </script>
